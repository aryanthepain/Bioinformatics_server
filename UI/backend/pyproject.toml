[project]
name = "pfp-backend"
version = "0.1.0"
description = "FastAPI backend for the Protein Function Predictor"
# Python 3.12 is the safest version for the libraries we will add later
# (PyTorch, Transformers, Biopython). uv downloads it automatically.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "requests>=2.31,<3",
    "biopython>=1.84,<2",
    # Used by the quaternary_pipeline package (quaternary/session.py).
    "pandas>=2.0,<4",
]

[dependency-groups]
# Machine-learning libraries: ESM-2 for the primary level; S4PRED and ESM-2 SS3
# (PyTorch, Transformers) and GOR IV (gor4, C code built with cffi, so it needs a C
# compiler) for the secondary level; pydssp (secondary structure of the AlphaFold DB
# structure) for the tertiary level. gor4 is pinned to the secondary notebook's commit.
# `uv sync` installs them (see default-groups below); the server image installs
# them separately (CPU-only PyTorch), so `uv export --no-group primary` leaves them out.
primary = [
    "torch>=2.6,<3",
    "transformers>=4.50,<5",
    "pydssp>=0.9,<1",
    "gor4 @ git+https://github.com/acorg/gor4.git@38de0ac7def0dde4f6c6efea3cce2fed772137d1",
]

[tool.uv]
default-groups = ["primary"]

# No [build-system] table on purpose: uv treats this as an application,
# installs only the dependencies, and never tries to package the code.
