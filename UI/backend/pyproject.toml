[project]
name = "pfp-backend"
version = "0.1.0"
description = "FastAPI backend for the Protein Function Predictor"
# Python 3.12 is the safest version for the libraries we will add later
# (PyTorch, Transformers, Biopython). uv downloads it automatically.
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "requests>=2.31,<3",
    "biopython>=1.84,<2",
]

[dependency-groups]
# Machine-learning libraries for the primary-structure module (ESM-2).
# `uv sync` installs them (see default-groups below); the free hosted build
# leaves them out with `uv export --no-group primary`.
primary = [
    "torch>=2.4,<3",
    "transformers>=4.44,<6",
]

[tool.uv]
default-groups = ["primary"]

# No [build-system] table on purpose: uv treats this as an application,
# installs only the dependencies, and never tries to package the code.
